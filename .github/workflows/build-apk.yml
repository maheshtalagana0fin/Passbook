name: Build Passbook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-passbook",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor-firebase/authentication": "^8.0.0",
              "firebase": "^12.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "typescript": "^5.0.0"
            }
          }
          EOF

          npm install

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.maheshtalagana.passbook',
            appName: 'My Passbook',
            webDir: 'www',
            bundledWebRuntime: false,
            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: false,
                providers: ['google.com']
              }
            }
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Restore permanent signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > passbook-release.keystore

          test -s passbook-release.keystore

          echo "Permanent keystore restored successfully"

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json

          cp google-services.json android/app/google-services.json

          echo "Firebase configuration copied successfully"

      - name: Configure Firebase Authentication Google provider
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          text = p.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'""",
                  1
              )

          p.write_text(text)
          PY

      - name: Configure Google Services plugin
        working-directory: android
        run: |
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.3" apply false' build.gradle

          sed -i '/plugins {/a\    id "com.google.gms.google-services"' app/build.gradle

      - name: Configure APK signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > app/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  passbook {
                      storeFile file("../passbook-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "passbook"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.passbook
                  }
              }
          }
          EOF

          echo "" >> app/build.gradle
          echo 'apply from: "signing.gradle"' >> app/build.gradle

          echo "===== Signing configuration ====="
          cat app/signing.gradle

      - name: Sync web application and native plugins
        run: npx cap sync android

      - name: Verify permanent signing certificate
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "===== Permanent signing SHA-1 ====="

          keytool -list -v \
            -keystore passbook-release.keystore \
            -alias passbook \
            -storepass "$KEYSTORE_PASSWORD" | grep SHA1

      - name: Verify Android Firebase configuration
        run: |
          echo "===== Firebase checks ====="

          test -f android/app/google-services.json
          echo "✓ google-services.json exists"

          grep -q '"package_name": "com.maheshtalagana.passbook"' android/app/google-services.json
          echo "✓ Android package name matches"

          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
          echo "✓ Google provider enabled"

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Verify APK signing
        working-directory: android
        run: |
          echo "===== APK signing report ====="
          ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Passbook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
