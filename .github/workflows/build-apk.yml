name: Build Passbook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-passbook",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor-firebase/authentication": "^8.0.0",
              "firebase": "^12.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "typescript": "^5.0.0"
            }
          }
          EOF

          npm install

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.maheshtalagana.passbook',
            appName: 'My Passbook',
            webDir: 'www',
            bundledWebRuntime: false,
            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: false,
                providers: ['google.com']
              }
            }
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Generate permanent signing keystore
        working-directory: android
        run: |
          keytool -genkeypair \
            -keystore passbook-release.keystore \
            -alias passbook \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass navalarch0253 \
            -keypass navalarch0253 \
            -dname "CN=Mahesh, OU=Passbook, O=Personal, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Show permanent keystore SHA-1
        working-directory: android
        run: |
          keytool -list -v \
            -keystore passbook-release.keystore \
            -alias passbook \
            -storepass navalarch0253 | grep SHA1

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Authentication Google provider
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          text = p.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'""",
                  1
              )

          p.write_text(text)
          PY

      - name: Configure Google Services plugin
        working-directory: android
        run: |
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.3" apply false' build.gradle
          sed -i '/plugins {/a\    id "com.google.gms.google-services"' app/build.gradle

      - name: Configure APK signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../passbook-release.keystore")
                      storePassword "navalarch0253"
                      keyAlias "passbook"
                      keyPassword "navalarch0253"
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {" + signing, 1)

          text = text.replace(
              "debug {",
              """debug {
                      signingConfig signingConfigs.release""",
              1
          )

          p.write_text(text)
          PY

      - name: Sync web application and native plugins
        run: npx cap sync android

      - name: Verify signing and Firebase configuration
        working-directory: android
        run: |
          echo "===== Permanent keystore SHA-1 ====="
          keytool -list -v \
            -keystore passbook-release.keystore \
            -alias passbook \
            -storepass navalarch0253 | grep SHA1

          echo "===== APK signing report ====="
          ./gradlew signingReport

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload permanent keystore
        uses: actions/upload-artifact@v4
        with:
          name: Passbook-Permanent-Keystore
          path: android/passbook-release.keystore
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Passbook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
