name: Build Passbook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-passbook",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo No web build required"
            },
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor-firebase/authentication": "^8.0.0",
              "firebase": "^12.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "typescript": "^5.0.0"
            }
          }
          EOF

          npm install

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.maheshtalagana.passbook',
            appName: 'My Passbook',
            webDir: 'www',
            bundledWebRuntime: false,
            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: false,
                providers: ['google.com']
              }
            }
          };

          export default config;
          EOF

            - name: Add Android platform
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          cp google-services.json android/app/google-services.json
          echo "Firebase config copied successfully"

      - name: Configure Firebase Authentication Google provider
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          text = p.read_text()

          old = "ext {"
          new = """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'"""

          if "rgcfaIncludeGoogle" not in text:
              if old not in text:
                  raise SystemExit("ERROR: ext { block not found in variables.gradle")
              text = text.replace(old, new, 1)

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Configure Google Services plugin
        working-directory: android
        run: |
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.3" apply false' build.gradle
          sed -i '/plugins {/a\    id "com.google.gms.google-services"' app/build.gradle

      - name: Sync web application and native plugins
        run: npx cap sync android

      - name: Verify Android Firebase configuration
        run: |
          echo "===== Checking Firebase configuration ====="

          test -f android/app/google-services.json
          echo "✓ google-services.json exists"

          grep -q '"package_name": "com.maheshtalagana.passbook"' android/app/google-services.json
          echo "✓ Android package name matches"

          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
          echo "✓ Google provider dependency enabled"

          grep -q 'androidxCredentialsVersion' android/variables.gradle
          echo "✓ Credential dependency version configured"

          echo "===== variables.gradle ====="
          cat android/variables.gradle

          echo "===== Checking generated dependencies ====="
          grep -R "googleid\|play-services-auth" android/app/build.gradle android/capacitor-cordova-android-plugins 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Show Debug SHA-1
        working-directory: android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Passbook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
